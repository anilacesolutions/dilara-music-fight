version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify hands the console's environment variables to the build, but they
        # do not reach the SSR runtime, so the server booted without MONGODB_URI and
        # every database-backed page answered 500. Writing the server-side ones into
        # .env.production makes the built app carry them. Only server variables
        # belong here: Next sends nothing to the browser unless the name starts
        # with NEXT_PUBLIC_.
        - env | grep -E '^(MONGODB_URI|MONGODB_DB|NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_MIXPANEL_TOKEN|NEXT_PUBLIC_MIXPANEL_HOST|JUDGE_PROVIDER|OPENAI_API_KEY|OPENAI_MODEL|YOUTUBE_API_KEY|AWS_REGION|BEDROCK_MODEL_ID|AWS_BEARER_TOKEN_BEDROCK)=' >> .env.production || true
        # Names only, never values. Without this the log cannot tell a variable
        # that was never entered from one entered after the last build, and that
        # guess has already cost a round of deploys.
        - for name in MONGODB_URI MONGODB_DB NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_MIXPANEL_TOKEN NEXT_PUBLIC_MIXPANEL_HOST JUDGE_PROVIDER OPENAI_API_KEY OPENAI_MODEL YOUTUBE_API_KEY; do if printenv "$name" > /dev/null; then echo "env check: $name set"; else echo "env check: $name MISSING"; fi; done
        - npm run build
        # Next reads .env.production from the application root at startup; the
        # standalone bundle, when there is one, needs its own copy.
        - if [ -d .next/standalone ]; then cp .env.production .next/standalone/.env.production; fi
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
